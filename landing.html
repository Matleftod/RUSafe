<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R'U SAFE | Landing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="preload" href="assets/DORA.png" as="image" />
  <link rel="preload" href="assets/AUSECAF.png" as="image" />
  <link rel="preload" href="assets/SECEDI.png" as="image" />
  <link rel="preload" href="assets/DIAG6 2030.png" as="image" />
  <link rel="preload" href="assets/mockups/handphoneLeft.png" as="image" />
  <link rel="preload" href="assets/mockups/laptop.png" as="image" />
  <link rel="preload" href="assets/mockups/moniteur.png" as="image" />
  <link rel="preload" href="assets/mockups/handphoneright.png" as="image" />
  <link rel="stylesheet" href="design-system.css" />
  <link rel="stylesheet" href="landing.css" />
</head>
<body class="landing-page">
  <main class="landing-shell" aria-label="Présentation R'U SAFE">
    <div class="landing-viewport">
      <div class="landing-glow" aria-hidden="true"></div>

      <div class="stage-slider" data-stage-slider>
        <section class="stage-panel stage-panel--landing" data-stage="landing" aria-labelledby="landing-title">
          <div class="panel-frame panel-frame--landing">
            <img
              class="brand-logo brand-logo--landing"
              src="assets/logo.png"
              alt="Logo R'U SAFE"
              width="237"
              height="171"
              loading="eager"
            />

            <div class="landing-copy">
              <h1 id="landing-title">Bienvenue sur R’U SAFE</h1>
              <p class="landing-slogan" data-slogan aria-live="polite">
                Grand angle sur <span class="accent">vos risques.</span>
              </p>
            </div>

            <div class="landing-actions">
              <button class="pill-button pill-button--gradient landing-cta" type="button" data-open-gate>
                <span>Découvrir nos activités</span>
              </button>
            </div>
          </div>
        </section>

        <section class="stage-panel stage-panel--gate" data-stage="gate" aria-labelledby="gate-title" aria-hidden="true">
          <div class="panel-frame panel-frame--gate">
            <div class="gate-topbar">
              <button class="back-link" type="button" aria-label="Revenir à la landing" data-back-to-landing>
                <span></span>
              </button>

              <img
                class="brand-logo brand-logo--gate"
                src="assets/logo.png"
                alt="Logo R'U SAFE"
                width="237"
                height="171"
                loading="eager"
              />
            </div>

            <section class="gate-card" aria-labelledby="gate-title">
              <h2 class="sr-only" id="gate-title">Choix des activités</h2>

              <div class="gate-tabs" role="tablist" aria-label="Activités">
                <button class="gate-tab is-active" type="button" role="tab" aria-selected="true" tabindex="0" data-gate-tab="dora">DORA</button>
                <button class="gate-tab" type="button" role="tab" aria-selected="false" tabindex="-1" data-gate-tab="ausecaf">AUSECAF</button>
                <button class="gate-tab" type="button" role="tab" aria-selected="false" tabindex="-1" data-gate-tab="secedi">SECEDI</button>
                <button class="gate-tab" type="button" role="tab" aria-selected="false" tabindex="-1" data-gate-tab="diag62030">DIAG6 2030</button>
              </div>

              <div class="gate-body">
                <p class="gate-description" data-gate-description>
                  Passez de la conformité « papier » à la résilience opérationnelle.
                </p>

                <div class="gate-media-row">
                  <div class="gate-media-stage" data-gate-stage>
                    <div class="gate-video-shell is-mounted is-visible" data-gate-media-layer="primary" aria-hidden="false">
                      <div class="video-mockup-anchor">
                        <div class="video-mockup" data-video-mockup data-mockup-type="handphoneLeft">
                          <div class="video-mockup__screen">
                            <video
                              class="gate-video-player video-mockup__video"
                              data-gate-video
                              width="524"
                              height="288"
                              controls
                              preload="metadata"
                              playsinline
                            >
                              <p>
                                Votre navigateur ne peut pas lire cette vidéo.
                                Utilisez un navigateur compatible HTML5.
                              </p>
                            </video>
                          </div>

                          <img
                            class="video-mockup__frame"
                            data-gate-frame
                            src="assets/mockups/handphoneLeft.png"
                            alt=""
                            width="1333"
                            height="652"
                            loading="eager"
                            decoding="async"
                            aria-hidden="true"
                          />
                        </div>
                      </div>
                    </div>

                    <div class="gate-video-shell" data-gate-media-layer="secondary" aria-hidden="true">
                      <div class="video-mockup-anchor">
                        <div class="video-mockup" data-video-mockup data-mockup-type="handphoneLeft">
                          <div class="video-mockup__screen">
                            <video
                              class="gate-video-player video-mockup__video"
                              data-gate-video
                              width="524"
                              height="288"
                              controls
                              preload="metadata"
                              playsinline
                            >
                              <p>
                                Votre navigateur ne peut pas lire cette vidéo.
                                Utilisez un navigateur compatible HTML5.
                              </p>
                            </video>
                          </div>

                          <img
                            class="video-mockup__frame"
                            data-gate-frame
                            src="assets/mockups/handphoneLeft.png"
                            alt=""
                            width="1333"
                            height="652"
                            loading="eager"
                            decoding="async"
                            aria-hidden="true"
                          />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <a class="pill-button pill-button--gradient gate-access" href="accueil.html">
                  <span>Accéder au site</span>
                  <span class="button-arrow" aria-hidden="true"></span>
                </a>
              </div>
            </section>
          </div>
        </section>
      </div>

      <p class="page-footer">Mentions - Confidentialité - Contact</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
